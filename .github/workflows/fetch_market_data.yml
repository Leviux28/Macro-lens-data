name: Fetch Macro Lens Market Data

on:
  schedule:
    # 06:10 UTC = 14:10 台北時間，台股 13:30 收盤後執行
    - cron: '10 6 * * 1-5'
    # 21:45 UTC，涵蓋美股夏令/冬令收盤後（20:00 或 21:00 UTC 收盤）
    - cron: '45 21 * * 1-5'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」測試

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push data file
        run: |
          git config user.name "macro-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market_data.json
          git diff --quiet --cached || git commit -m "Update market_data.json [automated]"
          git push
